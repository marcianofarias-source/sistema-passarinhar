<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Vendas e Visitas</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        h1, h2 { margin-bottom: 15px; color: #2c3e50; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        button.btn-danger { background-color: #e74c3c; }
        button.btn-danger:hover { background-color: #c0392b; }
        button.btn-warning { background-color: #f39c12; }
        button.btn-warning:hover { background-color: #d68910; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #ecf0f1; }
        .actions { display: flex; gap: 5px; }
        .actions button { padding: 5px 10px; margin: 0; width: auto; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestão Comercial</h1>

    <div class="grid-2">
        <!-- GERENCIAMENTO DE CLIENTES -->
        <div class="card">
            <h2>Cadastrar / Importar Clientes</h2>
            <form id="formClient">
                <input type="text" id="cliName" placeholder="Nome / Razão Social" required>
                <input type="text" id="cliCity" placeholder="Cidade - UF" required>
                <input type="text" id="cliAddress" placeholder="Endereço">
                <input type="text" id="cliPhone" placeholder="Telefone / Fone Resid">
                <button type="submit">Cadastrar Cliente</button>
            </form>

            <hr style="margin: 15px 0;">
            <h3>Importar do Excel</h3>
            <input type="file" id="excelFile" accept=".xls,.xlsx">
            <button type="button" onclick="importExcel()">Enviar Planilha</button>
        </div>

        <!-- GERENCIAMENTO DE USUÁRIOS -->
        <div class="card">
            <h2>Cadastrar Usuário / Vendedor</h2>
            <form id="formUser">
                <input type="text" id="usrName" placeholder="Nome Completo" required>
                <input type="text" id="usrUsername" placeholder="Usuário (Login)" required>
                <input type="password" id="usrPassword" placeholder="Senha" required>
                <select id="usrRole">
                    <option value="Vendedor">Vendedor</option>
                    <option value="Administrador">Administrador</option>
                </select>
                <button type="submit">Cadastrar Usuário</button>
            </form>
        </div>
    </div>

    <!-- TABELA DE CLIENTES -->
    <div class="card">
        <h2>Clientes Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Razão Social / Nome</th>
                    <th>Cidade</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tblClients"></tbody>
        </table>
    </div>

    <!-- TABELA DE USUÁRIOS -->
    <div class="card">
        <h2>Usuários / Vendedores</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Usuário</th>
                    <th>Perfil</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tblUsers"></tbody>
        </table>
    </div>
</div>

<!-- MODAL EDITAR CLIENTE -->
<div class="modal" id="modalClient">
    <div class="modal-content">
        <h2>Editar Cliente</h2>
        <input type="hidden" id="editCliId">
        <input type="text" id="editCliName" placeholder="Razão Social / Nome">
        <input type="text" id="editCliCity" placeholder="Cidade">
        <input type="text" id="editCliAddress" placeholder="Endereço">
        <input type="text" id="editCliPhone" placeholder="Telefone">
        <button type="button" onclick="saveClientEdit()">Salvar Alterações</button>
        <button type="button" class="btn-danger" onclick="closeModals()">Cancelar</button>
    </div>
</div>

<!-- MODAL EDITAR USUÁRIO -->
<div class="modal" id="modalUser">
    <div class="modal-content">
        <h2>Editar Usuário</h2>
        <input type="hidden" id="editUsrId">
        <input type="text" id="editUsrName" placeholder="Nome">
        <input type="text" id="editUsrUsername" placeholder="Usuário">
        <input type="password" id="editUsrPassword" placeholder="Nova Senha (opcional)">
        <select id="editUsrRole">
            <option value="Vendedor">Vendedor</option>
            <option value="Administrador">Administrador</option>
        </select>
        <button type="button" onclick="saveUserEdit()">Salvar Alterações</button>
        <button type="button" class="btn-danger" onclick="closeModals()">Cancelar</button>
    </div>
</div>

<script>
    const API_URL = ''; // Deixar vazio se servido na mesma origem ou insira o URL do seu servidor Render

    document.addEventListener('DOMContentLoaded', () => {
        loadClients();
        loadUsers();
    });

    // --- CARREGAR DADOS ---
    async function loadClients() {
        const res = await fetch(`${API_URL}/api/clients`);
        const data = await res.json();
        const tbody = document.getElementById('tblClients');
        tbody.innerHTML = data.map(c => `
            <tr>
                <td>${c.id}</td>
                <td>${c.name}</td>
                <td>${c.city || ''}</td>
                <td>${c.phone || ''}</td>
                <td class="actions">
                    <button class="btn-warning" onclick="openEditClient(${c.id}, '${c.name}', '${c.city || ''}', '${c.address || ''}', '${c.phone || ''}')">Editar</button>
                    <button class="btn-danger" onclick="deleteClient(${c.id})">Excluir</button>
                </td>
            </tr>
        `).join('');
    }

    async function loadUsers() {
        const res = await fetch(`${API_URL}/api/users`);
        const data = await res.json();
        const tbody = document.getElementById('tblUsers');
        tbody.innerHTML = data.map(u => `
            <tr>
                <td>${u.id}</td>
                <td>${u.name}</td>
                <td>${u.username}</td>
                <td>${u.role}</td>
                <td class="actions">
                    <button class="btn-warning" onclick="openEditUser(${u.id}, '${u.name}', '${u.username}', '${u.role}')">Editar</button>
                    <button class="btn-danger" onclick="deleteUser(${u.id})">Excluir</button>
                </td>
            </tr>
        `).join('');
    }

    // --- CADASTROS ---
    document.getElementById('formClient').addEventListener('submit', async (e) => {
        e.preventDefault();
        await fetch(`${API_URL}/api/clients`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('cliName').value,
                city: document.getElementById('cliCity').value,
                address: document.getElementById('cliAddress').value,
                phone: document.getElementById('cliPhone').value
            })
        });
        e.target.reset();
        loadClients();
    });

    document.getElementById('formUser').addEventListener('submit', async (e) => {
        e.preventDefault();
        await fetch(`${API_URL}/api/users`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('usrName').value,
                username: document.getElementById('usrUsername').value,
                password: document.getElementById('usrPassword').value,
                role: document.getElementById('usrRole').value
            })
        });
        e.target.reset();
        loadUsers();
    });

    // --- IMPORTAR EXCEL ---
    async function importExcel() {
        const fileInput = document.getElementById('excelFile');
        if (!fileInput.files[0]) return alert('Selecione um arquivo Excel!');

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        const res = await fetch(`${API_URL}/api/clients/import`, { method: 'POST', body: formData });
        const result = await res.json();

        if (result.success) {
            alert(`${result.count} clientes importados com sucesso!`);
            loadClients();
        } else {
            alert('Erro ao importar planilha.');
        }
    }

    // --- ALTERAÇÕES E EXCLUSÕES DE CLIENTE ---
    function openEditClient(id, name, city, address, phone) {
        document.getElementById('editCliId').value = id;
        document.getElementById('editCliName').value = name;
        document.getElementById('editCliCity').value = city;
        document.getElementById('editCliAddress').value = address;
        document.getElementById('editCliPhone').value = phone;
        document.getElementById('modalClient').style.display = 'flex';
    }

    async function saveClientEdit() {
        const id = document.getElementById('editCliId').value;
        await fetch(`${API_URL}/api/clients/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('editCliName').value,
                city: document.getElementById('editCliCity').value,
                address: document.getElementById('editCliAddress').value,
                phone: document.getElementById('editCliPhone').value
            })
        });
        closeModals();
        loadClients();
    }

    async function deleteClient(id) {
        if (!confirm('Deseja realmente excluir este cliente?')) return;
        await fetch(`${API_URL}/api/clients/${id}`, { method: 'DELETE' });
        loadClients();
    }

    // --- ALTERAÇÕES E EXCLUSÕES DE USUÁRIO ---
    function openEditUser(id, name, username, role) {
        document.getElementById('editUsrId').value = id;
        document.getElementById('editUsrName').value = name;
        document.getElementById('editUsrUsername').value = username;
        document.getElementById('editUsrPassword').value = '';
        document.getElementById('editUsrRole').value = role;
        document.getElementById('modalUser').style.display = 'flex';
    }

    async function saveUserEdit() {
        const id = document.getElementById('editUsrId').value;
        await fetch(`${API_URL}/api/users/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('editUsrName').value,
                username: document.getElementById('editUsrUsername').value,
                password: document.getElementById('editUsrPassword').value,
                role: document.getElementById('editUsrRole').value
            })
        });
        closeModals();
        loadUsers();
    }

    async function deleteUser(id) {
        if (!confirm('Deseja realmente excluir este usuário?')) return;
        await fetch(`${API_URL}/api/users/${id}`, { method: 'DELETE' });
        loadUsers();
    }

    function closeModals() {
        document.getElementById('modalClient').style.display = 'none';
        document.getElementById('modalUser').style.display = 'none';
    }
</script>

</body>
</html>
